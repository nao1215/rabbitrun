# generated by octocov init
coverage:
  paths:
    - cover.out
  badge:
    path: doc/coverage.svg
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
codeToTestRatio:
  badge:
    path: doc/ratio.svg
testExecutionTime:
  badge:
    path: doc/time.svg
