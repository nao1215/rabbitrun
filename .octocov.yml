# generated by octocov init
coverage:
  if: true
  acceptable: 90%
  paths:
    - cover.out
  exclude:
    # main only parses the flags and starts the window (RunGame), which unit tests do not open
    - "**/main.go"
    # the runner of the atago end-to-end suite
    - "e2e/**"
  badge:
    path: doc/coverage.svg
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
codeToTestRatio:
  badge:
    path: doc/ratio.svg
testExecutionTime:
  badge:
    path: doc/time.svg
