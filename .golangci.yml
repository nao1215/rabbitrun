version: "2"
run:
  go: "1.26"
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dogsled
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - intrange
    - makezero
    - mirror
    - misspell
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
  # Deliberately not enabled:
  #   mnd              - a game is built from layout coordinates, colors and
  #                      timings; naming every one of them would hide the
  #                      picture the numbers describe rather than explain it.
  #   gochecknoglobals - Ebitengine drives one Game value from a single goroutine;
  #                      loaded assets, fonts, audio and the save data live at
  #                      package level on purpose.
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      disable-default-exclusions: true
      exclude-functions:
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteRune
        - (*bytes.Buffer).WriteString
        - (*strings.Builder).Write
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - (*strings.Builder).WriteString
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      # A switch with a default branch already handles every other value.
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    tagliatelle:
      case:
        rules:
          json: snake
        use-field-name: true
  exclusions:
    generated: strict
    presets: []
    # tools/ holds the private image pipeline and the rule simulator; it is not published
    paths:
      - tools/
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nao1215/rabbitrun
  exclusions:
    generated: strict
