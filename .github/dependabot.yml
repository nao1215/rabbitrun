version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
      time: "20:00"
    open-pull-requests-limit: 10
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # init, analyze and upload-sarif must stay on one version: CodeQL fails when they differ.
      codeql-action:
        patterns:
          - "github/codeql-action*"
