name: Release Smoke

# Build the GoReleaser artifacts in snapshot mode (no publishing) and smoke-test
# them on every PR and push to main, so packaging regressions are caught before
# a release is tagged. Building is cross-compilation and happens once on
# Ubuntu; running the binaries is not, so the macOS and Windows binaries are
# executed on macOS and Windows runners.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build artifacts and smoke-test on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Release artifacts are built with the newest supported Go, not go.mod's
      # minimum, so players get the current runtime and its security fixes.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false

      # The goreleaser before hook collects the dependency license texts.
      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      - name: Build release artifacts (snapshot, no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --snapshot --clean --skip=publish,sign,sbom

      - name: Smoke-test artifacts
        run: ./scripts/smoke_artifacts.sh dist

      - name: Upload artifacts for the per-OS smoke jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-snapshot
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  smoke-cross:
    name: Smoke-test artifacts on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-snapshot
          path: dist

      - name: Smoke-test the macOS artifacts
        if: runner.os == 'macOS'
        run: ./scripts/smoke_artifacts.sh dist

      - name: Smoke-test the Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_artifact.ps1 -DistDir dist
