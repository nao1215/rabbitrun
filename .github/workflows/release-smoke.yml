name: Release Smoke

# Build the GoReleaser artifacts in snapshot mode (no publishing) and smoke-test
# them on every PR and push to main, so packaging regressions are caught before
# a release is tagged. Building is cross-compilation and happens once on
# Ubuntu; running the binaries is not, so the macOS and Windows binaries are
# executed on macOS and Windows runners.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel the superseded run of a pull request when it is pushed again. Every
# other run (push, schedule, manual) is its own group, so none is ever canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build artifacts and smoke-test on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Release artifacts are built with the newest supported Go, not go.mod's
      # minimum, so players get the current runtime and its security fixes.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version: "stable"
          check-latest: true
          cache: false

      # The snapshot cross-compiles six targets, which no other job builds, so
      # it keeps its own cache key. Saved only from main; release.yml itself
      # still builds from a clean cache.
      - name: Restore Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-release-smoke-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-release-smoke-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-release-smoke-${{ steps.go.outputs.go-version }}-

      # The goreleaser before hook collects the dependency license texts.
      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      - name: Build release artifacts (snapshot, no publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish,sign,sbom

      - name: Smoke-test artifacts
        run: ./scripts/smoke_artifacts.sh dist

      - name: Save Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-release-smoke-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

      - name: Upload artifacts for the per-OS smoke jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-snapshot
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  smoke-cross:
    name: Smoke-test artifacts on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-snapshot
          path: dist

      - name: Smoke-test the macOS artifacts
        if: runner.os == 'macOS'
        run: ./scripts/smoke_artifacts.sh dist

      - name: Smoke-test the Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_artifact.ps1 -DistDir dist
