name: golangci-lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The linter's toolchain is bounded by the linter: a released
      # golangci-lint binary embeds the go/types of the Go it was built with and
      # cannot type-check a newer standard library. Newer toolchains are covered
      # by unit_test.yml, which compiles and runs the code.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: nao1215/setup-ebitengine@v0

      - name: Run golangci-lint as an enforced gate
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  # A linter only sees the files that build for its GOOS. Ebitengine has
  # platform-specific code paths, so the other release targets are linted too.
  golangci-lint-cross:
    name: golangci-lint (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows]
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
