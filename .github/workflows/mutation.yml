name: Mutation
# Mutation testing rewrites one expression at a time and checks that a test
# fails. It reruns the tests once per mutant, so it is too slow for every pull
# request: the full run is weekly, and pull requests mutate only the lines
# they change (gremlins --diff, run from the module root so the paths that
# git diff prints match the files gremlins mutates).
#
# Only the game's rules are mutated: road/ (the road and what happens on it),
# internal/engine/ (speeds, the careful player's search) and internal/save/.
# The screens, sound and pictures (internal/game, gfx, sound, input, assets,
# character) are checked by their own tests and the pixel tests, and one run of
# internal/game's tests takes about 40 seconds, which a mutant would pay each time.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GREMLINS_VERSION: v0.6.0
  # A mutant that allocates without bound (e.g. an endless write loop) takes the
  # hosted runner down with "runner has received a shutdown signal" and no log.
  # A cap per process makes it die as a killed mutant instead. 8 GiB, not the
  # usual 4: gremlins first measures coverage over the whole module, which
  # builds Ebitengine with cgo.
  MUTANT_MEMORY_KIB: '8388608'
  # gremlins matches these against paths relative to the module root.
  EXCLUDE_SCREENS: '^(internal/(assets|character|game|gfx|input|sound)|e2e|scripts|tools)/'
  EXCLUDE_MAIN: '^[^/]+\.go$'

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The coverage run builds every package, and the screen packages link
      # Ebitengine, which needs the OpenGL/X11/ALSA headers.
      - uses: nao1215/setup-ebitengine@cfefbee9dc7af161aebb2c8d36c07a0e1727271a # v1.0.0
        with:
          xvfb: true
      # gremlins v0.6.0 needs Go 1.25 or later to build; stable keeps this job
      # off the go.mod floor, which has its own unit test job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install gremlins
        run: go install "github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}"
      - name: Mutate the lines this pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # gremlins treats each hunk's added lines as one range, so with the
          # default 3 lines of context a second change in the same hunk is not
          # mutated. Zero context gives one hunk per change.
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: diff.context
          GIT_CONFIG_VALUE_0: '0'
          GIT_CONFIG_KEY_1: diff.interHunkContext
          GIT_CONFIG_VALUE_1: '0'
        # Run from the module root: gremlins compares git diff paths as given.
        run: |
          ulimit -v "$MUTANT_MEMORY_KIB"
          xvfb-run --auto-servernum gremlins unleash --diff "$BASE_SHA" --workers 2 --timeout-coefficient 10 \
            --exclude-files "$EXCLUDE_SCREENS" --exclude-files "$EXCLUDE_MAIN" --output mutation.json .
      - name: Mutate the game's rules
        if: github.event_name != 'pull_request'
        run: |
          ulimit -v "$MUTANT_MEMORY_KIB"
          xvfb-run --auto-servernum gremlins unleash --workers 2 --timeout-coefficient 10 \
            --exclude-files "$EXCLUDE_SCREENS" --exclude-files "$EXCLUDE_MAIN" --output mutation.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: mutation.json
          if-no-files-found: ignore
