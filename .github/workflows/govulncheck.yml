name: govulncheck

# Vulnerability scanning against the official Go vulnerability database
# (https://vuln.go.dev). gosec (in .golangci.yml) looks for insecure code this
# repository writes; govulncheck answers whether a known CVE in the standard
# library or a dependency is reachable from the game's call graph.
#
# The database changes continuously, so the daily leg catches an advisory
# published between pull requests.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Every supported Go version is scanned: a standard-library advisory is
      # fixed in a specific patch of a specific minor. The first entry equals
      # the go directive in go.mod; keep it in sync with unit_test.yml.
      fail-fast: false
      matrix:
        go:
          - "1.26.6"
          - "stable"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      # Pinned so a scanner release cannot change this job's verdict on its own.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan for known vulnerabilities
        run: govulncheck ./...
