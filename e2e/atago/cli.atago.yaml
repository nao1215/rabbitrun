# The command line of rabbitrun: the help and the version exit 0 on stdout, and a
# mistake in how the game was started exits 2 with the error first and a pointer to
# --help on stderr, instead of a page of usage with the error at its end, or the game
# opening with the option ignored. None of these open a window, so they run on every
# OS. Every run uses an isolated home, and `changes` proves nothing was written.
# Run with:
#   make e2e   (or go run ./e2e/runner)
version: "1"

suite:
  name: rabbitrun command line

scenarios:
  - name: --help prints the usage on stdout and exits 0
    steps:
      - run:
          command: rabbitrun --help
          sandbox_home: true
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            contains:
              - "Rabbit Run - a sweets-themed road runner"
              - "rabbitrun [options]"
              - "--bgm-wav DIR"
              - "--capture DIR"
              - "--debug"
              - "-h, --help"
              - "--record-demo FILE"
              - "--record-char ID"
              - "--record-stage int"
              - "--record-seconds int"
              - "--reset-save"
              - "-V, --version"
              - "https://github.com/nao1215/rabbitrun/issues"
          changes:
            created: []
            modified: []
            deleted: []

  # -h and --help are the same option: the two outputs are byte-identical.
  - name: -h prints the same usage as --help
    steps:
      - run:
          command: rabbitrun -h
          sandbox_home: true
          stdout_to: short.txt
      - run:
          command: rabbitrun --help
          sandbox_home: true
          stdout_to: long.txt
      - assert:
          exit_code: 0
      - assert:
          file:
            path: short.txt
            equals_file: long.txt

  # The runner builds with -X main.version=v0.0.0-e2e, so this also pins that the
  # release version reaches the binary through the linker flag.
  - name: --version prints the version from the build and exits 0
    steps:
      - run:
          command: rabbitrun --version
          sandbox_home: true
      - assert:
          exit_code: 0
          stdout:
            equals: "rabbitrun v0.0.0-e2e\n"
          stderr:
            empty: true

  - name: -V is the short form of --version
    steps:
      - run:
          command: rabbitrun -V
          sandbox_home: true
      - assert:
          exit_code: 0
          stdout:
            equals: "rabbitrun v0.0.0-e2e\n"

  # --help wins over everything else on the line, even a mistake after it.
  - name: --help wins over other options and arguments
    steps:
      - run:
          command: rabbitrun --help --reset-save stray
          sandbox_home: true
      - assert:
          exit_code: 0
          stdout:
            contains: "rabbitrun [options]"
          changes:
            created: []
            modified: []
            deleted: []

  - name: an unknown option exits 2 with the error first and a pointer to --help
    steps:
      - run:
          command: rabbitrun --nope
          sandbox_home: true
      - assert:
          exit_code: 2
          stdout:
            empty: true
          stderr:
            equals: "rabbitrun: unknown flag: --nope\nRun 'rabbitrun --help' to see the options.\n"

  - name: an unknown short option exits 2
    steps:
      - run:
          command: rabbitrun -x
          sandbox_home: true
      - assert:
          exit_code: 2
          stdout:
            empty: true
          stderr:
            equals: "rabbitrun: unknown shorthand flag: 'x' in -x\nRun 'rabbitrun --help' to see the options.\n"

  - name: an option missing its directory exits 2 and names the option
    steps:
      - run:
          command: rabbitrun --capture
          sandbox_home: true
      - assert:
          exit_code: 2
          stdout:
            empty: true
          stderr:
            contains:
              - "rabbitrun: flag needs an argument: --capture"
              - "Run 'rabbitrun --help'"

  - name: a number option given a word exits 2 and names the value
    steps:
      - run:
          command: rabbitrun --record-demo demo.mp4 --record-stage abc
          sandbox_home: true
      - assert:
          exit_code: 2
          stderr:
            contains: 'invalid argument "abc" for "--record-stage" flag'
          changes:
            created: []
            modified: []
            deleted: []

  # Without the check, `rabbitrun shots` (the option name forgotten) opened the game
  # and ignored the word.
  - name: a bare argument exits 2 instead of starting the game
    steps:
      - run:
          command: rabbitrun shots
          sandbox_home: true
          timeout: 20s
      - assert:
          exit_code: 2
          stdout:
            empty: true
          stderr:
            equals: "rabbitrun: unexpected argument \"shots\" (options start with --, e.g. --capture DIR)\nRun 'rabbitrun --help' to see the options.\n"
          changes:
            created: []
            modified: []
            deleted: []

  # An empty directory used to mean "not given", so the game opened instead.
  - name: an empty directory for --capture exits 2
    steps:
      - run:
          command: rabbitrun --capture=
          sandbox_home: true
          timeout: 20s
      - assert:
          exit_code: 2
          stderr:
            contains: "rabbitrun: --capture needs a non-empty value"

  - name: an empty directory for --bgm-wav exits 2
    steps:
      - run:
          command: rabbitrun --bgm-wav=
          sandbox_home: true
          timeout: 20s
      - assert:
          exit_code: 2
          stderr:
            contains: "rabbitrun: --bgm-wav needs a non-empty value"

  # Each of these does one job and exits; given two, one used to win silently (here
  # the WAVs would be written and the save left alone).
  - name: two jobs at once exit 2 before doing either
    steps:
      - run:
          command: rabbitrun --bgm-wav wav --reset-save
          sandbox_home: true
      - assert:
          exit_code: 2
          stderr:
            contains: "rabbitrun: --bgm-wav and --reset-save cannot be used together; run them one at a time"
          changes:
            created: []
            modified: []
            deleted: []

  - name: --capture and --record-demo together exit 2
    steps:
      - run:
          command: rabbitrun --capture shots --record-demo demo.mp4
          sandbox_home: true
      - assert:
          exit_code: 2
          stderr:
            contains: "--capture and --record-demo cannot be used together"
          changes:
            created: []
            modified: []
            deleted: []

  # The demo options used to be ignored without --record-demo, and the game opened.
  - name: a demo option without --record-demo exits 2
    steps:
      - run:
          command: rabbitrun --record-stage 2
          sandbox_home: true
          timeout: 20s
      - assert:
          exit_code: 2
          stderr:
            contains: "rabbitrun: --record-stage only works with --record-demo FILE"

  - name: --record-char without --record-demo exits 2
    steps:
      - run:
          command: rabbitrun --record-char cute
          sandbox_home: true
          timeout: 20s
      - assert:
          exit_code: 2
          stderr:
            contains: "rabbitrun: --record-char only works with --record-demo FILE"
